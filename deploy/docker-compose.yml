# XRUFY production stack: PostgreSQL + API + Next.js
# Usage (from this directory):
#   cp .env.example .env   # edit secrets
#   docker compose up -d --build
#
# Web: http://SERVER_IP:WEB_PORT (default 3000)
# API (internal): http://api:4000 — browser uses Next rewrite /api/forms

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xrufy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-xrufy}
    volumes:
      - xrufy_pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-xrufy.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-xrufy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-xrufy}
      WEB3FORMS_ACCESS_KEY: ${WEB3FORMS_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4000"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        SERVER_ORIGIN: http://api:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  # Optional: schema sync after you change Drizzle schema (not needed on fresh volume — init-db.sql runs once).
  #   docker compose --profile migrate run --rm db-push
  db-push:
    profiles: ["migrate"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-xrufy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-xrufy}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  xrufy_pg_data:
